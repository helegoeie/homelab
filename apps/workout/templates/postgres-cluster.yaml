# IMPORTANT: this Postgres cluster is shared infrastructure — it backs both Forgejo's
# and Zitadel's databases (databases/roles: apps/workout/templates/postgres-databases.yaml).
# Despite the "workout" namespace name (a historical leftover), this is NOT disposable.
# There is no backup target configured for it — deleting this Cluster is unrecoverable.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: workout-pg
  namespace: workout
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: workout
      owner: workout
  postgresql:
    pg_hba:
      - host all all 10.244.0.0/16 scram-sha-256
  managed:
    roles:
      - name: forgejo
        ensure: present
        login: true
        passwordSecret:
          name: forgejo-pg-password
