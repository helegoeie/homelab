# IMPORTANT: this Postgres cluster is shared infrastructure — it backs both Forgejo's
# and Zitadel's databases (databases/roles: apps/workout/templates/postgres-databases.yaml).
# Despite the "workout" namespace name (a historical leftover), this is NOT disposable.
# Backed up to Cloudflare R2 by the Barman Cloud plugin: continuous WAL archiving
# plus a nightly base backup (object-store.yaml, scheduled-backup.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: workout-pg
  namespace: workout
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: workout
      owner: workout
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-store
  postgresql:
    pg_hba:
      - host all all 10.244.0.0/16 scram-sha-256
  managed:
    roles:
      - name: forgejo
        ensure: present
        login: true
        passwordSecret:
          name: forgejo-pg-password
