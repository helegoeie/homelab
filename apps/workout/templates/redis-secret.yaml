# redis-secret and forgejo-pg-password must be pre-created manually before ArgoCD sync
# (out of git, same convention as other manual secrets in this repo):
#
#   kubectl create secret generic redis-secret \
#     --from-literal=password='<strong-password>' \
#     -n workout
#
#   kubectl create secret generic forgejo-pg-password \
#     --from-literal=username=forgejo \
#     --from-literal=password='<strong-password>' \
#     -n workout
#
# Both passwords must match apps/forgejo/values.yaml's config.database.PASSWD and the
# redis password embedded in config.cache/queue/session CONN_STR/HOST values.
# This file is a placeholder comment; the actual Secrets are not managed by ArgoCD to
# keep credentials out of git.
