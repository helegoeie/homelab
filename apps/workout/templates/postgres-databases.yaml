apiVersion: postgresql.cnpg.io/v1
kind: Role
metadata:
  name: forgejo-role
  namespace: workout
spec:
  name: forgejo
  login: true
  passwordSecret:
    name: forgejo-pg-password
  cluster:
    name: workout-pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forgejo-db
  namespace: workout
spec:
  name: forgejo
  owner: forgejo
  cluster:
    name: workout-pg

# NOTE: zitadel-role / zitadel-db were removed here after the workout-pg cluster was
# recreated from scratch (its prior data — including Zitadel's — was unrecoverable, no
# backup target existed). Restoring Zitadel's connection requires a separate, deliberate
# pass: recreate its role/database here, generate a new zitadel-pg-password secret, and
# update apps/zitadel/values.yaml's Postgres Admin/User passwords + rerun its init job.
