apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: workout-pg-nightly
  namespace: workout
spec:
  # six-field cron (seconds first): 02:30 every night
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: workout-pg
