# Off-site target for workout-pg. Credentials: manual secret workout/r2-backup
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY); never in git.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2-store
  namespace: workout
  annotations:
    # CRD comes from the cnpg app (plugin-barman-cloud); let sync retry until it exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://barrows-backup/cnpg/
    endpointURL: https://245a73116c580f0e6c708784c197034a.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: r2-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: r2-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
