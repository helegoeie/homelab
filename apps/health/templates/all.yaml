apiVersion: v1
kind: ConfigMap
metadata: { name: health-code }
data:
{{ (.Files.Glob "files/*.ts").AsConfig | indent 2 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: health-data
  labels:
    # Short-lived buffer of health data: kept out of the nightly R2 backup.
    recurring-job-source.longhorn.io: enabled
    recurring-job-group.longhorn.io/no-backup: enabled
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources: { requests: { storage: {{ .Values.persistence.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: health }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: health } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: health }
      annotations:
        checksum/code: {{ (.Files.Glob "files/*.ts").AsConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: health
          image: {{ .Values.image | quote }}
          command: ["bun", "/app/server.ts"]
          env:
            - name: INGEST_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: ingest-token } }
            - name: DRAIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: drain-token } }
          ports: [{ name: http, containerPort: 3000 }]
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: code, configMap: { name: health-code } }
        - { name: tmp, emptyDir: {} }
        - { name: data, persistentVolumeClaim: { claimName: health-data } }
---
apiVersion: v1
kind: Service
metadata: { name: health }
spec:
  selector: { app.kubernetes.io/name: health }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-cloudflared }
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cloudflared } } }]
      ports: [{ port: 3000, protocol: TCP }]
