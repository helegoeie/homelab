# The Ollama API has no authentication: any client can run, pull or delete
# models. vid01 is its only user. Egress is left open (model pulls).
# Kubelet probes come from the node and are always allowed by Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vid01-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vid01
      ports:
        - port: 11434
          protocol: TCP
