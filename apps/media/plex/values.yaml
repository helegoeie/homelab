app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/plex
            tag: latest@sha256:01a53d9c7adcbb3701fbb0a4230c0a37c85453759b6b05a67356c3c7a09de08d
          env:
            TZ: Europe/Amsterdam
            PUID: "1000"
            PGID: "1000"
            VERSION: docker
          securityContext:
            privileged: true
  service:
    main:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 192.168.1.241
      ports:
        http:
          port: 32400
  persistence:
    config:
      existingClaim: plex-config
      globalMounts:
        - path: /config
    media:
      existingClaim: media-pvc
      globalMounts:
        - path: /media
    dri:
      type: hostPath
      hostPath: /dev/dri
      globalMounts:
        - path: /dev/dri
