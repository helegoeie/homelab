app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/plex
            tag: latest@sha256:d6e045dac4ea2ccb94e0aa4441e02dbec9c9d306d650814eb33d20ad497a2107
          env:
            TZ: Europe/Amsterdam
            PUID: "1000"
            PGID: "1000"
            VERSION: docker
          securityContext:
            privileged: true
  service:
    main:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 192.168.1.241
      ports:
        http:
          port: 32400
  persistence:
    config:
      existingClaim: plex-config
      globalMounts:
        - path: /config
    media:
      existingClaim: media-pvc
      globalMounts:
        - path: /media
    dri:
      type: hostPath
      hostPath: /dev/dri
      globalMounts:
        - path: /dev/dri
