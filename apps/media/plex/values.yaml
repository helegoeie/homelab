app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/plex
            tag: latest@sha256:3f71bd6eb6a4478ac19b11c5d0ba9746a5eacad1976f9b99ed4a2c21767e57bb
          env:
            TZ: Europe/Amsterdam
            PUID: "1000"
            PGID: "1000"
            VERSION: docker
          securityContext:
            privileged: true
  service:
    main:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 192.168.1.241
      ports:
        http:
          port: 32400
  persistence:
    config:
      existingClaim: plex-config
      globalMounts:
        - path: /config
    media:
      existingClaim: media-pvc
      globalMounts:
        - path: /media
    dri:
      type: hostPath
      hostPath: /dev/dri
      globalMounts:
        - path: /dev/dri
