app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/plex
            tag: latest@sha256:be083133dfe001b6caed5a321720e6db9d38fdde1ea8f9d29340d40057a7fa53
          env:
            TZ: Europe/Amsterdam
            PUID: "1000"
            PGID: "1000"
            VERSION: docker
          securityContext:
            privileged: true
  service:
    main:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 192.168.1.241
      ports:
        http:
          port: 32400
  persistence:
    config:
      existingClaim: plex-config
      globalMounts:
        - path: /config
    media:
      existingClaim: media-pvc
      globalMounts:
        - path: /media
    dri:
      type: hostPath
      hostPath: /dev/dri
      globalMounts:
        - path: /dev/dri
