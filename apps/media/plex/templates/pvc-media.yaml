apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: media
  labels:
    # Excluded from the nightly R2 backup (too big or regenerable).
    recurring-job-source.longhorn.io: enabled
    recurring-job-group.longhorn.io/no-backup: enabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
