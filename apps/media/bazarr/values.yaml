app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/bazarr
            tag: latest@sha256:c1673816321156b904af9b7e6415ea547ae9622e4acc375358f1e1eb9ed1e904
          env:
            TZ: Europe/Amsterdam
            PUID: "1000"
            PGID: "1000"
  service:
    main:
      controller: main
      ports:
        http:
          port: 6767
  persistence:
    config:
      existingClaim: bazarr-config
      globalMounts:
        - path: /config
    media:
      existingClaim: media-pvc
      globalMounts:
        - path: /media
