app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/manimatter/decluttarr
            tag: latest@sha256:fd3dc206c17df32190cda1bed2ef3ee1cb9726bd108aa7e97e83e47cb3e72d78
          env:
            TZ: Europe/Amsterdam
            RADARR_URL: http://radarr.media.svc.cluster.local:7878
            SONARR_URL: http://sonarr.media.svc.cluster.local:8989
            QBITTORRENT_URL: http://qbittorrent.media.svc.cluster.local:8080
          envFrom:
            - secretRef:
                name: decluttarr-credentials
  persistence:
    config:
      type: configMap
      name: decluttarr-config
      globalMounts:
        - path: /app/config/config.yaml
          subPath: config.yaml
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
