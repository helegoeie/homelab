apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "log01.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "log01.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Single replica + Recreate: the RWO SQLite volume can't be mounted by two pods.
  # Only an api release restarts this pod; the site (web Deployment) stays up and
  # the client retries sync until the api is back.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "log01.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "log01.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        # The api runs as the image's unprivileged `node` user (1000). fsGroup
        # hands it the SQLite volume (files were root-owned when it ran as root).
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Node + SQLite backend for accounts and cross-device sync.
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: PORT
              value: "4000"
            - name: DB_PATH
              value: /data/log01.db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.auth.existingSecret }}
                  key: {{ .Values.api.auth.secretKey }}
            {{- with .Values.api.auth.cloudflareAccess }}
            - name: CF_ACCESS_TEAM_DOMAIN
              value: {{ .teamDomain | quote }}
            - name: CF_ACCESS_AUD
              value: {{ .aud | quote }}
            {{- end }}
          ports:
            - name: api
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # Writable scratch space; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "log01.fullname" . }}-data
