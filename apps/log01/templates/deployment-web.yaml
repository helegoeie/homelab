apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "log01.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "log01.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  # Stateless nginx serving the SPA: rolls one pod at a time, so the site stays
  # up during a deploy (the old pod serves until the new one is ready).
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "log01.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "log01.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        # nginx serves the SPA and proxies /api → the api Service.
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            - name: API_UPSTREAM
              value: "{{ include "log01.fullname" . }}-api:4000"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Keep serving for a few seconds after the pod is marked for deletion, so
          # ingress-nginx and cloudflared drop it from their endpoints before nginx
          # stops (without this a rollout shows brief connection refusals).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # nginx's master starts as root (port 80, workers drop to nginx); keep
          # only the capabilities it needs for that.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
