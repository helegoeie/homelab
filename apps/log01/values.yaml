# web (nginx SPA) and api (node + SQLite on a RWO Longhorn volume) are separate
# Deployments: web rolls with no downtime, the api is a single Recreate pod.


web:
  replicas: 2
  image:
    repository: forgejo.barrows.helegoeie.dev/helegoeie/log01
    pullPolicy: Always
    tag: "v0.3.6"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

api:
  image:
    repository: forgejo.barrows.helegoeie.dev/helegoeie/log01-api
    pullPolicy: Always
    tag: "v0.3.6"
  # JWT signing key — pre-create the secret (see app.yaml note).
  auth:
    existingSecret: log01-secrets
    secretKey: jwt-secret
    # Cloudflare Access login (log01 >= v0.3.4): the Access session on
    # log01.helegoeie.dev becomes the log01 login. Not secrets: the team domain is
    # the token issuer and the AUD tag is inside every token. Empty disables it.
    cloudflareAccess:
      teamDomain: small-darkness-167b.cloudflareaccess.com
      aud: fb0b7be27194cef252f28211c935dcdcde8369b86215206f25d8a238dd838327
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Persistent SQLite store for the api (accounts + synced state).
persistence:
  storageClass: longhorn
  size: 1Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: log01.barrows.helegoeie.dev
  tls:
    secretName: log01-tls
