longhorn:
  defaultSettings:
    # Detached volumes (the second Minecraft world) are attached for the nightly backup.
    allowRecurringJobWhileVolumeDetached: true
    defaultReplicaCount: 1
    storageMinimalAvailablePercentage: 10
    storageReservedPercentageForDefaultDisk: 10
  # Controls the replica count baked into the default `longhorn` StorageClass.
  # Without this the chart hard-codes numberOfReplicas: "3", which overrides the
  # defaultReplicaCount setting above for any PVC using the default class.
  persistence:
    defaultClassReplicaCount: 1
  preUpgradeChecker:
    jobEnabled: false
  # Off-site backups to Cloudflare R2. Credentials live in the manually created
  # secret longhorn-system/r2-backup (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  # AWS_ENDPOINTS=https://<account-id>.r2.cloudflarestorage.com); never in git.
  defaultBackupStore:
    backupTarget: s3://barrows-backup@auto/longhorn/
    backupTargetCredentialSecret: r2-backup
