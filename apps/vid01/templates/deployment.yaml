apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vid01.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vid01.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate (not RollingUpdate): the RWO SQLite volume can't be mounted by two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vid01.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vid01.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        # The api runs as the image's unprivileged `node` user (1000). fsGroup
        # hands it the SQLite volume (files were root-owned when it ran as root).
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        # nginx serves the SPA and proxies /api → the api sidecar over localhost.
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            - name: API_UPSTREAM
              value: "127.0.0.1:4000"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # nginx's master starts as root (port 80, workers drop to nginx); keep
          # only the capabilities it needs for that.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
        # Node + SQLite backend: polls YouTube RSS feeds and serves the video list.
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: PORT
              value: "4000"
            - name: DB_PATH
              value: /data/vid01.db
            - name: SEED_CHANNELS
              value: {{ .Values.api.seedChannels | quote }}
            - name: POLL_INTERVAL_MS
              value: {{ .Values.api.pollIntervalMs | quote }}
            - name: OLLAMA_URL
              value: {{ .Values.api.ollamaUrl | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.api.ollamaModel | quote }}
          ports:
            - name: api
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # Writable scratch space; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vid01.fullname" . }}-data
