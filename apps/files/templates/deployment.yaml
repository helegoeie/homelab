apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "files.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "files.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "files.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dufs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - { name: DUFS_SERVE_PATH, value: /data }
            - { name: DUFS_PORT, value: "5000" }
            - { name: DUFS_ALLOW_UPLOAD, value: "true" }
            - { name: DUFS_ALLOW_DELETE, value: "true" }
            - { name: DUFS_ALLOW_SEARCH, value: "true" }
            - { name: DUFS_ALLOW_ARCHIVE, value: "true" }
            - { name: DUFS_HIDDEN, value: "lost+found" }
            # Upload/delete still need the rw admin rule; guests are read-only.
            - name: DUFS_AUTH
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: DUFS_AUTH }
          ports:
            - name: http
              containerPort: 5000
          livenessProbe:
            httpGet: { path: /__dufs__/health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /__dufs__/health, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: files-data
