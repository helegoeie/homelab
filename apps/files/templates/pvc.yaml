apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "files.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
