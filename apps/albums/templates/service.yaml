apiVersion: v1
kind: Service
metadata:
  name: alb01
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "albums.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "albums.labels" . | nindent 4 }}
