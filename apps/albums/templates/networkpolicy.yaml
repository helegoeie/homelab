# Only cloudflared (alb01.helegoeie.dev, behind Cloudflare Access) may reach the
# app. No LAN ingress: without Access there is no identity.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - port: 3000
          protocol: TCP
