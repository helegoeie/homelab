# Two replicas: cloudflared is stateless and each replica opens its own set of
# edge connections, so a node reboot doesn't take the public hostnames down.
replicaCount: 2

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  tag: "2026.8.0"

tunnel:
  # Tunnel UUID from `cloudflared tunnel create barrows`.
  # Not a secret — it is published in the public CNAME as <id>.cfargotunnel.com.
  id: "8b3c1cdd-0f97-439b-80c7-0795cece2b36"
  credentials:
    # Manually created secret (see app.yaml).
    existingSecret: cloudflared-credentials
    secretKey: credentials.json

# Public hostname → in-cluster origin.
#
# This list is the entire public attack surface: only what is named here is
# reachable from the internet. Everything else stays on *.barrows.helegoeie.dev,
# which resolves to a private IP and is only reachable over LAN/Tailscale.
#
# Origins point straight at the ClusterIP service, not at ingress-nginx — the
# edge terminates TLS, so there is no cert to manage on the origin hop.
ingress:
  - hostname: log01.helegoeie.dev
    service: http://log01.log01.svc.cluster.local:80

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
