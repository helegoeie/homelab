gitea:
  image:
    registry: ""
    repository: codeberg.org/forgejo/forgejo
    tag: 16@sha256:cf5f5ae6acf2ababca0ee3d255705b83a47f35b25e07fc931d694d60664053fe
    rootless: false

  gitea:
    # gitea.gitea.admin/config maps to .Values.gitea.admin/config inside the gitea sub-chart.
    admin:
      # Pre-create: kubectl create secret generic forgejo-admin-secret \
      #   --from-literal=username='helegoeie' \
      #   --from-literal=password='<strong-admin-password>' \
      #   -n forgejo
      existingSecret: forgejo-admin-secret
    # Credentials (database PASSWD, redis cache/queue/session URLs) are NOT in git:
    # this repo is public. They come from the manually created secret
    # 'forgejo-app-config' (one key per app.ini section), merged over the config below:
    #   kubectl create secret generic forgejo-app-config -n forgejo \
    #     --from-literal=database='PASSWD=<pg-password>' \
    #     --from-literal=cache='HOST=redis://:<redis-password>@workout-redis-master.workout.svc.cluster.local:6379/0' \
    #     --from-literal=queue='CONN_STR=redis://:<redis-password>@workout-redis-master.workout.svc.cluster.local:6379/1' \
    #     --from-literal=session='PROVIDER_CONFIG=redis://:<redis-password>@workout-redis-master.workout.svc.cluster.local:6379/2'
    # The passwords must match workout/forgejo-pg-password and workout/redis-secret.
    additionalConfigSources:
      - secret:
          secretName: forgejo-app-config
    config:
      database:
        DB_TYPE: postgres
        HOST: workout-pg-rw.workout.svc.cluster.local:5432
        NAME: forgejo
        USER: forgejo
      cache:
        ADAPTER: redis
      queue:
        TYPE: redis
      session:
        PROVIDER: redis
      server:
        DOMAIN: forgejo.barrows.helegoeie.dev
        ROOT_URL: https://forgejo.barrows.helegoeie.dev
        HTTP_PORT: 3000

  ingress:
    enabled: false

  postgresql:
    enabled: false

  postgresql-ha:
    enabled: false

  redis-cluster:
    enabled: false

  valkey-cluster:
    enabled: false
